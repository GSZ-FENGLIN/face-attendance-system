server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/face_attendance?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: your_password_here
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: SELECT 1
      max-lifetime: 60000
      idle-timeout: 30000
      minimum-idle: 2
      maximum-pool-size: 10
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.attendance.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

face:
  service:
    url: http://localhost:5000

jwt:
  secret: ChangeThisSecretKeyInProduction!@#$%
  expiration: 86400000
